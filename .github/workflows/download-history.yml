name: Download history

# Weekly snapshot of cumulative downloads of this repo's release files.
# GitHub exposes only the current total per release asset (download_count),
# with no history, so each run records one dated entry and commits it.
# A same-day rerun replaces that day's entry; earlier entries are never changed.
#
# This repo's main is not branch-protected and GitHub Actions is not permitted to
# open pull requests here, so the snapshot is committed straight to main with the
# default GITHUB_TOKEN (contents: write). The downloads report reads
# .github/stats/download-history.json from main. (The older Trustabl repos land
# the same file via a snapshot PR; this one commits directly -- same file, same
# format, read the same way.)

on:
  schedule:
    - cron: '0 16 * * 0'      # weekly, Monday 00:00 Philippine time (UTC+8) = Sunday 16:00 UTC
  workflow_dispatch:           # run on demand to add an entry now

permissions:
  contents: write              # commit the snapshot to main

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record cumulative downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          HISTORY_FILE: .github/stats/download-history.json
        run: |
          python3 - <<'PY'
          import datetime, json, os, urllib.request

          repo   = os.environ["TARGET_REPO"]
          path   = os.environ["HISTORY_FILE"]
          token  = os.environ.get("GITHUB_TOKEN", "")

          def api(url):
              req = urllib.request.Request(url)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              req.add_header("User-Agent", "trustabl-download-history")
              if token:
                  req.add_header("Authorization", "Bearer " + token)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          releases, page = {}, 1
          while True:
              rels = api("https://api.github.com/repos/%s/releases?per_page=100&page=%d" % (repo, page))
              if not rels:
                  break
              for rel in rels:
                  if rel.get("draft"):
                      continue
                  releases[rel["tag_name"]] = sum(   # every release file: GitHub's own download total
                      a.get("download_count", 0) for a in rel.get("assets", [])
                  )
              if len(rels) < 100:
                  break
              page += 1

          day = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).date().isoformat()   # Philippine date, like the analyzer

          if os.path.exists(path):
              with open(path) as f:
                  data = json.load(f)
          else:
              data = {"history": []}

          hist = {p["date"]: p for p in data.get("history", [])}
          # "date" and "downloads" match the analyzer/probe history format; "releases" is the per-release split.
          hist[day] = {
              "date": day,
              "downloads": sum(releases.values()),
              "releases": {tag: releases[tag] for tag in sorted(releases)},
          }
          out = {
              "repo": repo,
              "unit": "cumulative_release_downloads",
              "note": "GitHub release downloads (download_count summed over every release file), not users. Includes automated installs such as CI.",
              "history": [hist[d] for d in sorted(hist)],
          }

          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, "w") as f:
              json.dump(out, f, indent=2)
              f.write("\n")
          print("%s: %s = %d cumulative release downloads across %d releases" % (day, repo, out["history"][-1]["downloads"], len(releases)))
          PY

      - name: Commit the snapshot to main
        run: |
          if [ -z "$(git status --porcelain .github/stats/download-history.json)" ]; then
            echo "No change in download-history.json; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/stats/download-history.json
          git commit -m "chore: record weekly download snapshot"
          git push
